# Copia de los comentarios en el propio sitio (ADR 0030 del repositorio diarioiaeducativa/periodico): cada pieza
# los lee de comentarios/AAAA-MM-DD/id.json sin conectarse a giscus ni a GitHub; giscus, solo al pulsar «Comentar».
# Se rehace todo con cada comentario nuevo, editado o borrado, y cada hora, por lo que se oculta al moderar (GitHub
# no avisa de eso). La publicación diaria no toca comentarios/ (rsync --exclude /comentarios/).
# El programa, en .github/copiar-comentarios.py.
name: Copia de los comentarios

on:
  discussion_comment:
    types: [created, edited, deleted]
  discussion:
    types: [deleted, edited, category_changed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/copiar-comentarios.py", ".github/workflows/copiar-comentarios.yml"]

permissions:
  contents: write       # para subir comentarios/
  discussions: read

# Una copia detrás de otra: dos comentarios seguidos no se pisan al subir
concurrency:
  group: copiar-comentarios
  cancel-in-progress: false

jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            comentarios
          fetch-depth: 1
      - name: Copiar y subir
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Diario de IA Educativa (comentarios)"
          git config user.email "diarioiaeducativa@users.noreply.github.com"
          # Si entretanto ha salido el número del día, se rehace la copia sobre lo nuevo y se vuelve a subir
          for intento in 1 2 3 4 5; do
            git fetch -q --depth 1 origin main && git reset -q --hard origin/main
            python3 .github/copiar-comentarios.py comentarios
            git add -A .   # con el checkout parcial, solo hay .github, comentarios y la raíz
            if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
            git commit -qm "Copia de los comentarios"
            if git push -q origin HEAD:main; then echo "Subida"; exit 0; fi
            sleep $((intento * 10))
          done
          exit 1
